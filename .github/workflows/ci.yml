name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/productivity_ci?replicaSet=rs0
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize MongoDB replica set
        run: |
          mongo_container="$(docker ps -q --filter "ancestor=mongo:7" | head -n 1)"
          if [ -z "$mongo_container" ]; then
            echo "MongoDB service container was not found"
            exit 1
          fi
          docker exec "$mongo_container" mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in {1..30}; do
            state="$(docker exec "$mongo_container" mongosh --quiet --eval 'rs.status().myState' 2>/dev/null || true)"
            if [ "$state" = "1" ]; then
              echo "MongoDB replica set is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become ready"
          exit 1

      - name: Run unit and database integration tests
        run: npm test
